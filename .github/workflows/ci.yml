name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned compiler
        id: compiler
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("rules.lock"))["compiler"]["commit"])')
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Fadouse/BashLume
          ref: ${{ steps.compiler.outputs.commit }}
          path: .work/bashlume
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: cachix/install-nix-action@v31
      - name: Build pinned Bash 5.3.9 oracle
        run: >-
          nix build
          github:NixOS/nixpkgs/fd1462031fdee08f65fd0b4c6b64e22239a77870#bashInteractive
          --out-link .work/bash-oracle
      - name: Build pinned pack tool
        run: cargo build --release --locked --bin bashlume-pack --manifest-path .work/bashlume/Cargo.toml
      - name: Validate pinned Stable baseline
        env:
          BASHLUME_PACK: ${{ github.workspace }}/.work/bashlume/target/release/bashlume-pack
          BASHLUME_COMPILER_CHECKOUT: ${{ github.workspace }}/.work/bashlume
          BASH_ORACLE: ${{ github.workspace }}/.work/bash-oracle/bin/bash
          CHANNEL: stable
        run: tests/ci.sh
