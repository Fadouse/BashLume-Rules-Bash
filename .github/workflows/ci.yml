name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Fadouse/BashLume
          path: .work/bashlume
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build pinned pack tool
        run: cargo build --release --bin bashlume-pack --manifest-path .work/bashlume/Cargo.toml
      - name: Validate pinned Stable baseline
        env:
          BASHLUME_PACK: ${{ github.workspace }}/.work/bashlume/target/release/bashlume-pack
          CHANNEL: stable
        run: tests/ci.sh
