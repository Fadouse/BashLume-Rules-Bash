name: Sync Edge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-edge
  cancel-in-progress: true

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve upstream Edge
        run: python3 compiler/update_lock.py --channel edge | tee /tmp/update.json
      - name: Open reviewed update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- rules.lock; then
            echo 'Already current'
            exit 0
          fi
          branch="automation/sync-edge-${GITHUB_RUN_ID}"
          git config user.name 'bashlume-rules-bot'
          git config user.email 'bashlume-rules-bot@users.noreply.github.com'
          git switch -c "$branch"
          git add rules.lock
          git commit -m 'chore: sync upstream edge lock'
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'chore: sync upstream Edge rules' \
            --body 'Automated lock update only. Conversion, complete coverage, differential parity, licensing, and security gates must pass before merge.'
